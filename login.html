<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Alice Poulain Café</title>
    <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #fcf6ec;
            --bg-card: #f3ede2;
            --text-primary: #2e2521;
            --btn-primary: #a82e2e;
            --btn-primary-text: #fcf6ec;
            --highlight: #b2a28b;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, var(--bg-primary) 0%, var(--bg-card) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-primary);
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            padding: 2rem;
        }

        .login-card {
            background: white;
            border-radius: 16px;
            padding: 3rem;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
            animation: slideDown 0.6s ease-out;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-40px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-logo {
            text-align: center;
            margin-bottom: 2rem;
        }

        .login-logo h1 {
            font-family: 'Libre Baskerville', serif;
            font-size: 2rem;
            color: var(--text-primary);
            margin-bottom: 0.5rem;
        }

        .login-logo p {
            color: var(--highlight);
            font-size: 0.9rem;
            font-weight: 500;
            letter-spacing: 1px;
        }

        .login-title {
            text-align: center;
            font-family: 'Libre Baskerville', serif;
            font-size: 1.8rem;
            margin-bottom: 1rem;
            color: var(--text-primary);
        }

        .login-subtitle {
            text-align: center;
            color: var(--text-primary);
            font-size: 0.95rem;
            margin-bottom: 2rem;
            opacity: 0.7;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.6rem;
            font-weight: 600;
            font-size: 0.95rem;
            color: var(--text-primary);
        }

        .form-group input {
            width: 100%;
            padding: 0.85rem;
            border: 2px solid var(--bg-card);
            border-radius: 8px;
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            color: var(--text-primary);
            transition: all 0.3s ease;
            background: var(--bg-primary);
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--highlight);
            box-shadow: 0 0 0 3px rgba(178, 162, 139, 0.1);
        }

        .login-btn {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(135deg, var(--btn-primary) 0%, #922424 100%);
            color: var(--btn-primary-text);
            border: none;
            border-radius: 8px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 1rem;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(168, 46, 46, 0.3);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        .error-message {
            color: #d32f2f;
            background: #ffebee;
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
            display: none;
            border-left: 4px solid #d32f2f;
            animation: shake 0.3s ease;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        .success-message {
            color: #2e7d32;
            background: #e8f5e9;
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
            display: none;
            border-left: 4px solid #2e7d32;
            animation: slideDown 0.3s ease;
        }

        .loading {
            display: none;
            text-align: center;
            color: var(--highlight);
            font-size: 0.9rem;
            margin-top: 1rem;
        }

        .spinner {
            display: inline-block;
            width: 12px;
            height: 12px;
            border: 2px solid var(--highlight);
            border-top: 2px solid transparent;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .demo-credentials {
            background: var(--bg-card);
            padding: 1.5rem;
            border-radius: 8px;
            margin-top: 2rem;
            border-left: 4px solid var(--highlight);
            font-size: 0.85rem;
        }

        .demo-credentials h4 {
            margin-bottom: 0.8rem;
            color: var(--text-primary);
            font-weight: 700;
        }

        .demo-credentials p {
            margin-bottom: 0.4rem;
            color: var(--text-primary);
            opacity: 0.8;
        }

        .credential-item {
            font-family: 'Courier New', monospace;
            background: white;
            padding: 0.5rem;
            border-radius: 4px;
            margin: 0.3rem 0;
            word-break: break-all;
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 1.5rem;
            }

            .login-title {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-logo">
                <h1>🎨 Alice Poulain</h1>
                <p>CAFÉ MANAGEMENT</p>
            </div>

            <h2 class="login-title">Owner Portal</h2>
            <p class="login-subtitle">Manage your café with ease</p>

            <div class="error-message" id="errorMsg"></div>
            <div class="success-message" id="successMsg"></div>

            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input 
                        type="email" 
                        id="email" 
                        placeholder="owner@alicepoulain.cafe"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input 
                        type="password" 
                        id="password" 
                        placeholder="Enter your password"
                        required
                    >
                </div>

                <button type="submit" class="login-btn">Login to Dashboard</button>
                <div class="loading" id="loading">
                    <span class="spinner"></span>
                    Logging in...
                </div>
            </form>

            <div class="demo-credentials">
                <h4>🔐 Demo Credentials</h4>
                <p>Email:</p>
                <div class="credential-item">owner@alicepoulain.cafe</div>
                <p style="margin-top: 0.8rem;">Password:</p>
                <div class="credential-item">SecurePassword123!</div>
                <p style="margin-top: 0.8rem; font-size: 0.8rem; opacity: 0.6;">Change these in .env file</p>
            </div>
        </div>
    </div>

    <script>
        async function handleLogin(event) {
            event.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMsg');
            const successMsg = document.getElementById('successMsg');
            const loading = document.getElementById('loading');

            errorMsg.style.display = 'none';
            successMsg.style.display = 'none';
            loading.style.display = 'block';

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (data.success) {
                    localStorage.setItem('authToken', data.token);
                    successMsg.textContent = '✅ ' + data.message;
                    successMsg.style.display = 'block';
                    
                    setTimeout(() => {
                        window.location.href = '/admin.html';
                    }, 1000);
                } else {
                    errorMsg.textContent = '❌ ' + data.error;
                    errorMsg.style.display = 'block';
                    loading.style.display = 'none';
                }
            } catch (error) {
                errorMsg.textContent = '❌ Connection error. Make sure the server is running.';
                errorMsg.style.display = 'block';
                loading.style.display = 'none';
            }
        }
    </script>
</body>
</html>
